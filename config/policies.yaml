policies:
  - name: block-sensitive-session-exfiltration
    id: block-sensitive-session-exfiltration
    description: Blocks external sends after sensitive session access.
    version: 1
    owner: platform-security
    status: ACTIVE
    review: {last_reviewed_at: 2026-10-10, review_interval_days: 90}
    change_reason: Initial lifecycle registration.
    priority: 200
    match:
      tool: external.send
      session_sensitive_data_accessed: true
      is_external_destination: true
    action: DENY
    reason: External transmission is blocked because this session recently accessed sensitive data.

  - name: block-sensitive-external-send
    id: block-sensitive-external-send
    description: Blocks direct sensitive external transmission.
    version: 1
    owner: platform-security
    status: ACTIVE
    review: {last_reviewed_at: 2026-10-10, review_interval_days: 90}
    change_reason: Initial lifecycle registration.
    priority: 100
    match:
      tool: external.send
      sensitive_data_involved: true
      is_external_destination: true
    action: DENY
    reason: Sensitive data cannot be transmitted to an external destination.

  - name: production-delete-requires-approval
    id: production-delete-approval
    description: Governs destructive production database actions.
    version: 1
    owner: platform-security
    status: ACTIVE
    review: {last_reviewed_at: 2026-10-10, review_interval_days: 90}
    change_reason: Initial lifecycle registration.
    priority: 90
    match:
      tool: database.delete
      environment: production
    action: REQUIRE_APPROVAL
    approval_workflow: production-destructive-workflow
    reason: Destructive production operations require human approval.

  - name: high-risk-needs-approval
    id: high-risk-approval
    description: Governs high-risk gateway actions.
    version: 1
    owner: platform-security
    status: ACTIVE
    review: {last_reviewed_at: 2026-10-10, review_interval_days: 90}
    change_reason: Initial lifecycle registration.
    priority: 50
    match:
      minimum_risk_level: HIGH
    action: REQUIRE_APPROVAL
    approval_workflow: default-high-risk-workflow
    reason: High-risk operations require human approval.

  - name: bulk-production-update-requires-approval
    id: bulk-production-update-approval
    description: Requires approval for high-impact bulk production changes.
    version: 1
    owner: platform-security
    status: ACTIVE
    review: {last_reviewed_at: 2026-10-10, review_interval_days: 90}
    change_reason: Phase 3 workflow-aware change control.
    priority: 80
    match:
      tool: database.update
      environment: production
      minimum_records_affected: 1000
      customer_impact: true
      required_tags: [change-control]
    action: REQUIRE_APPROVAL
    approval_workflow: production-destructive-workflow
    reason: Bulk customer-impacting production updates require human approval.

  - name: routine-development-update-allowed
    id: routine-development-update-allow
    description: Allows low-criticality development maintenance before generic risk handling.
    version: 1
    owner: platform-security
    status: ACTIVE
    review: {last_reviewed_at: 2026-10-10, review_interval_days: 90}
    change_reason: Phase 3 same-tool context baseline.
    priority: 60
    match:
      tool: database.update
      environment: development
      workflow_id: routine-maintenance
      business_criticality: low
    action: ALLOW
    reason: Routine development maintenance is allowed under its registered workflow.

  - name: critical-after-hours-production-change-denied
    id: critical-after-hours-production-deny
    description: Blocks critical emergency production changes after hours.
    version: 1
    owner: platform-security
    status: ACTIVE
    review: {last_reviewed_at: 2026-10-10, review_interval_days: 90}
    change_reason: Phase 3 emergency guardrail.
    priority: 95
    match:
      environment: production
      business_criticality: critical
      after_hours: true
    action: DENY
    reason: Critical after-hours production changes are denied pending an explicit controlled process.

  - name: default-allow
    id: default-allow
    description: Allows requests with no higher-priority match.
    version: 1
    owner: platform-security
    status: ACTIVE
    review: {last_reviewed_at: 2026-10-10, review_interval_days: 90}
    change_reason: Initial lifecycle registration.
    priority: 1
    match: {}
    action: ALLOW
    reason: No blocking policy matched.
